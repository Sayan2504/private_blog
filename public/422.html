<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Change rejected — MindCanvas</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png?v=2" type="image/png">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      :root {
        --canvas: #f9fafb;
        --surface: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --shadow: 0 1px 2px rgb(16 24 40 / .04), 0 12px 28px -16px rgb(16 24 40 / .18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #030712;
          --surface: #111827;
          --ink: #f9fafb;
          --muted: #9ca3af;
          --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 16px 32px -20px rgb(0 0 0 / .85);
        }
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 30rem;
        padding: 2rem;
        border-radius: 1.5rem;
        background-color: var(--surface);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        font-size: .875rem;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin-top: .5rem;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -.02em;
        line-height: 1.2;
      }

      p {
        margin-top: 1rem;
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        height: 2.5rem;
        margin-top: 1.75rem;
        padding: 0 1rem;
        border-radius: .375rem;
        background-color: var(--ink);
        color: var(--canvas);
        font-size: .875rem;
        font-weight: 500;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <p class="eyebrow">Error 422</p>
      <h1>That change couldn't be made.</h1>
      <p>The request was understood but refused. This usually means a form was submitted twice, or a page sat open long enough for its session to expire.</p>
      <a href="/">Back to MindCanvas</a>
    </main>
  </body>
</html>
