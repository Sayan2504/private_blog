# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

# `one` and `two` are published and owned by different users, which is what
# lets the All-stories tests prove the archive is not scoped to one author.
# `draft_one` is the unpublished counterpart guarding the read rules.

one:
  title: MyString
  user: one
  published_at: <%= 3.days.ago %>

two:
  title: Another story
  user: two
  published_at: <%= 2.days.ago %>

draft_one:
  title: Unfinished idea
  user: one
